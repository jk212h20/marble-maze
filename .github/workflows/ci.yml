name: checks

# Three jobs, because they have different needs and very different costs.
#
# The node checks run anywhere node does and take seconds. The browser checks need a Chromium with
# software GL, and on a 2-core runner one smoke check alone measured **7m35s** (versus about a
# minute on this laptop), so they are split across two runners to keep the wall time down and to
# make a failure say which check it was instead of "the browser step". Neither needs a GPU, a build
# step, or a server started by hand: sim/check-browser.mjs starts one on an ephemeral port.

on:
  push:
  pull_request:

jobs:
  node:
    name: node checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: physics, levels, tuning, marbles, vials
        run: npm test
      - name: every shipped level through the editor's rules
        run: npm run levels
      - name: the counts in the docs match the suite
        run: node tools/gen-status.mjs --check

  smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    # Bounded, so a stall fails visibly rather than sitting in the log. Sized for the runner's
    # software renderer with room to spare: this check is the slowest of the four.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: install Chromium (software GL)
        run: npx playwright install --with-deps chromium
      - name: loads the page, drives it, times frames
        run: npm run check:browser -- smoke
      - name: upload screenshots when the smoke check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/marblemaze-shots
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: install Chromium (software GL)
        run: npx playwright install --with-deps chromium
      - name: tuning panel, audio and renderer parity
        run: npm run check:browser -- tune audio parity
